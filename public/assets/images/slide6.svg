<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Moody Anime Detective Noir Palette -->
    <linearGradient id="detBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="35%" stop-color="#140a2a" />
      <stop offset="70%" stop-color="#1f103d" />
      <stop offset="100%" stop-color="#080312" />
    </linearGradient>

    <!-- Warm Detective Desk Lamplight -->
    <radialGradient id="deskLampGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="hairGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="40%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="irisGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#4338ca" />
      <stop offset="80%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>

    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#detBg)" />
  <circle cx="512" cy="300" r="450" fill="url(#deskLampGlow)" />

  <!-- Detective Investigation Board Corkboard Texture Border -->
  <rect x="30" y="30" width="964" height="964" rx="36" fill="none" stroke="#78350f" stroke-width="8" opacity="0.6" />

  <!-- Top Title Plaque -->
  <g transform="translate(182, 45)" filter="url(#glow6)">
    <rect width="660" height="70" rx="35" fill="#150a36" fill-opacity="0.95" stroke="#facc15" stroke-width="3" />
    <text x="330" y="47" font-family="'Fredoka One', Nunito, sans-serif" font-size="32" font-weight="900" fill="#facc15" text-anchor="middle">
      🕵️ Real or Fake Proportion? Be a Detective! 🕵️
    </text>
  </g>

  <!-- LEFT CASE: THE REAL DIRECT PROPORTION (Notebooks) -->
  <g transform="translate(60, 160)">
    <rect width="420" height="680" rx="26" fill="#150a36" fill-opacity="0.94" stroke="#4ade80" stroke-width="3.5" />
    
    <!-- Header Ribbon -->
    <rect x="0" y="0" width="420" height="60" rx="26" fill="#15803d" />
    <text x="210" y="42" font-family="'Fredoka One', Nunito, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">
      CASE #1: BUYING NOTEBOOKS
    </text>

    <!-- Evidence Content Rows -->
    <g transform="translate(25, 80)">
      <!-- Row 1: Zero test -->
      <rect width="370" height="70" rx="16" fill="#1e1045" stroke="#4ade80" stroke-width="1.5" />
      <text x="30" y="45" font-size="28">📓</text>
      <text x="75" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="20" font-weight="900" fill="#bae6fd">0 Books</text>
      <text x="230" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="22" font-weight="900" fill="#facc15">➔ ₹0</text>
      <text x="325" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#4ade80">✔ PASS</text>
    </g>

    <g transform="translate(25, 165)">
      <!-- Row 2: 1 Book -->
      <rect width="370" height="70" rx="16" fill="#1e1045" stroke="#4ade80" stroke-width="1.5" />
      <text x="30" y="45" font-size="28">📓</text>
      <text x="75" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="20" font-weight="900" fill="#bae6fd">1 Book</text>
      <text x="230" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="22" font-weight="900" fill="#facc15">➔ ₹15</text>
      <text x="325" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#4ade80">k = 15</text>
    </g>

    <g transform="translate(25, 250)">
      <!-- Row 3: 2 Books -->
      <rect width="370" height="70" rx="16" fill="#1e1045" stroke="#4ade80" stroke-width="1.5" />
      <text x="30" y="45" font-size="28">📓</text>
      <text x="75" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="20" font-weight="900" fill="#bae6fd">2 Books</text>
      <text x="230" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="22" font-weight="900" fill="#facc15">➔ ₹30</text>
      <text x="325" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#4ade80">k = 15</text>
    </g>

    <g transform="translate(25, 335)">
      <!-- Row 4: 4 Books -->
      <rect width="370" height="70" rx="16" fill="#1e1045" stroke="#4ade80" stroke-width="1.5" />
      <text x="30" y="45" font-size="28">📓</text>
      <text x="75" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="20" font-weight="900" fill="#bae6fd">4 Books</text>
      <text x="230" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="22" font-weight="900" fill="#facc15">➔ ₹60</text>
      <text x="325" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#4ade80">k = 15</text>
    </g>

    <!-- Verified verdict text -->
    <text x="210" y="450" font-family="Nunito, sans-serif" font-size="18" font-weight="bold" fill="#bae6fd" text-anchor="middle">
      Every single row gives y ÷ x = 15!
    </text>
    <text x="210" y="480" font-family="Nunito, sans-serif" font-size="18" font-weight="bold" fill="#bae6fd" text-anchor="middle">
      And 0 books cost exactly ₹0!
    </text>

    <!-- Big Green Rubber Stamp -->
    <g transform="translate(210, 570) rotate(-8)">
      <rect x="-140" y="-40" width="280" height="80" rx="18" fill="none" stroke="#22c55e" stroke-width="6" stroke-dasharray="14 6" />
      <text x="0" y="16" font-family="'Fredoka One', Nunito, sans-serif" font-size="36" font-weight="900" fill="#22c55e" text-anchor="middle">
        ✔ DIRECT!
      </text>
    </g>
  </g>

  <!-- RIGHT CASE: THE FAKE NON-PROPORTION (Taxi Starting Fare) -->
  <g transform="translate(544, 160)">
    <rect width="420" height="680" rx="26" fill="#150a36" fill-opacity="0.94" stroke="#f43f5e" stroke-width="3.5" />
    
    <!-- Header Ribbon -->
    <rect x="0" y="0" width="420" height="60" rx="26" fill="#be123c" />
    <text x="210" y="42" font-family="'Fredoka One', Nunito, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">
      CASE #2: TAXI FARE (₹50 BASE)
    </text>

    <!-- Evidence Content Rows -->
    <g transform="translate(25, 80)">
      <!-- Row 1: Zero test (FAILS) -->
      <rect width="370" height="70" rx="16" fill="#1e1045" stroke="#f43f5e" stroke-width="1.5" />
      <text x="30" y="45" font-size="28">🚕</text>
      <text x="75" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="20" font-weight="900" fill="#fed7aa">0 km</text>
      <text x="230" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="22" font-weight="900" fill="#f43f5e">➔ ₹50!</text>
      <text x="325" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#f43f5e">✘ FAILS</text>
    </g>

    <g transform="translate(25, 165)">
      <!-- Row 2: 1 km -->
      <rect width="370" height="70" rx="16" fill="#1e1045" stroke="#f43f5e" stroke-width="1.5" />
      <text x="30" y="45" font-size="28">🚕</text>
      <text x="75" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="20" font-weight="900" fill="#fed7aa">1 km</text>
      <text x="230" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="22" font-weight="900" fill="#facc15">➔ ₹60</text>
      <text x="325" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#f43f5e">60 ÷ 1 = 60</text>
    </g>

    <g transform="translate(25, 250)">
      <!-- Row 3: 2 km -->
      <rect width="370" height="70" rx="16" fill="#1e1045" stroke="#f43f5e" stroke-width="1.5" />
      <text x="30" y="45" font-size="28">🚕</text>
      <text x="75" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="20" font-weight="900" fill="#fed7aa">2 km</text>
      <text x="230" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="22" font-weight="900" fill="#facc15">➔ ₹70</text>
      <text x="325" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#f43f5e">70 ÷ 2 = 35</text>
    </g>

    <g transform="translate(25, 335)">
      <!-- Row 4: 4 km -->
      <rect width="370" height="70" rx="16" fill="#1e1045" stroke="#f43f5e" stroke-width="1.5" />
      <text x="30" y="45" font-size="28">🚕</text>
      <text x="75" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="20" font-weight="900" fill="#fed7aa">4 km</text>
      <text x="230" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="22" font-weight="900" fill="#facc15">➔ ₹90</text>
      <text x="325" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#f43f5e">90 ÷ 4 = 22.5</text>
    </g>

    <!-- Unfair changing ratio verdict text -->
    <text x="210" y="450" font-family="Nunito, sans-serif" font-size="18" font-weight="bold" fill="#fca5a5" text-anchor="middle">
      y ÷ x drops from 60 to 35 to 22.5!
    </text>
    <text x="210" y="480" font-family="Nunito, sans-serif" font-size="18" font-weight="bold" fill="#fca5a5" text-anchor="middle">
      The ratio changes ➔ NOT direct!
    </text>

    <!-- Big Red Rubber Stamp -->
    <g transform="translate(210, 570) rotate(8)">
      <rect x="-150" y="-40" width="300" height="80" rx="18" fill="none" stroke="#ef4444" stroke-width="6" stroke-dasharray="14 6" />
      <text x="0" y="16" font-family="'Fredoka One', Nunito, sans-serif" font-size="34" font-weight="900" fill="#ef4444" text-anchor="middle">
        ✘ NOT DIRECT!
      </text>
    </g>
  </g>

  <!-- CENTER ANIME DETECTIVE ZARA (Peeking in between the two boards) -->
  <g transform="translate(390, 520) scale(0.72)">
    <!-- Aura -->
    <circle cx="170" cy="180" r="140" fill="#facc15" opacity="0.2" filter="url(#glow6)" />

    <!-- Detective Trenchcoat / Capelet -->
    <path d="M 110 220 L 230 220 L 250 340 L 90 340 Z" fill="#78350f" stroke="#451a03" stroke-width="3" />
    <polygon points="150,220 190,220 170,280" fill="#ffffff" />
    <circle cx="170" cy="290" r="6" fill="#ca8a04" />

    <!-- Face & Neck -->
    <rect x="157" y="180" width="26" height="40" fill="#fed7aa" rx="5" />
    <path d="M 125 135 Q 120 190 148 215 Q 170 230 192 215 Q 220 190 215 135 Z" fill="#ffedd5" />
    <ellipse cx="140" cy="185" rx="10" ry="5" fill="#f43f5e" opacity="0.45" />
    <ellipse cx="200" cy="185" rx="10" ry="5" fill="#f43f5e" opacity="0.45" />

    <!-- Detective Wink Expression: Left eye winking (;), Right eye sharp and focused -->
    <path d="M 132 165 Q 146 175 160 165" fill="none" stroke="#1e1b4b" stroke-width="4.5" stroke-linecap="round" />
    <g transform="translate(182, 148)">
      <path d="M 0 5 Q 12 -4 22 8" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />
      <ellipse cx="11" cy="12" rx="8" ry="11" fill="url(#irisGrad6)" />
      <circle cx="8" cy="8" r="3.5" fill="#ffffff" />
    </g>
    <!-- Clever smirk -->
    <path d="M 160 195 Q 175 205 188 190" fill="none" stroke="#be123c" stroke-width="3" stroke-linecap="round" />

    <!-- Hair Bangs -->
    <path d="M 115 135 Q 110 75 170 75 Q 230 75 225 135 Q 210 105 190 115 Q 170 105 150 120 Q 130 110 115 135 Z" fill="url(#hairGrad6)" />

    <!-- Detective Deerstalker Cap -->
    <g transform="translate(110, 50)">
      <ellipse cx="60" cy="35" rx="65" ry="24" fill="#a16207" stroke="#713f12" stroke-width="3" />
      <path d="M 15 35 Q 60 -15 105 35 Z" fill="#b45309" stroke="#713f12" stroke-width="2.5" />
      <circle cx="60" cy="-5" r="7" fill="#fde047" />
    </g>

    <!-- Hand Holding Big Magnifying Glass -->
    <g transform="translate(50, 150)">
      <!-- Handle -->
      <line x1="30" y1="80" x2="60" y2="40" stroke="#78350f" stroke-width="12" stroke-linecap="round" />
      <!-- Rim -->
      <circle cx="75" cy="20" r="36" fill="none" stroke="#facc15" stroke-width="8" filter="url(#glow6)" />
      <circle cx="75" cy="20" r="32" fill="#38bdf8" opacity="0.35" />
      <line x1="55" y1="8" x2="85" y2="30" stroke="#fff" stroke-width="3" opacity="0.7" />
    </g>
  </g>

  <!-- Bottom Detective Clue Rule Banner -->
  <g transform="translate(100, 890)" filter="url(#glow6)">
    <rect width="824" height="75" rx="37" fill="#150a36" fill-opacity="0.95" stroke="#facc15" stroke-width="3" />
    <text x="412" y="47" font-family="'Fredoka One', Nunito, sans-serif" font-size="25" font-weight="900" fill="#facc15" text-anchor="middle">
      🔍 Detective Test: 1) Is y ÷ x constant for EVERY pair?  2) Does (0, 0) hold? 🔍
    </text>
  </g>
</svg>