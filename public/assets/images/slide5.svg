<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Deep Cosmic Observatory Background -->
    <linearGradient id="obsBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080214" />
      <stop offset="35%" stop-color="#140628" />
      <stop offset="70%" stop-color="#1f0a40" />
      <stop offset="100%" stop-color="#05010d" />
    </linearGradient>

    <radialGradient id="nebulaGlow5" cx="60%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="rayGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="30%" stop-color="#4ade80" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="hairGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="40%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="irisGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#4338ca" />
      <stop offset="80%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>

    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Sky & Nebula Background -->
  <rect width="1024" height="1024" fill="url(#obsBg)" />
  <rect width="1024" height="1024" fill="url(#nebulaGlow5)" />

  <!-- Stars Field -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="120" cy="80" r="1.5" /><circle cx="280" cy="140" r="2" /><circle cx="450" cy="90" r="1.2" />
    <circle cx="890" cy="120" r="2" /><circle cx="940" cy="240" r="1.5" /><circle cx="780" cy="80" r="1.8" />
    <circle cx="180" cy="260" r="1.2" /><circle cx="350" cy="210" r="1.8" /><circle cx="90" cy="410" r="2" />
  </g>

  <!-- Title Plaque Banner -->
  <g transform="translate(182, 40)" filter="url(#glow5)">
    <rect width="660" height="70" rx="35" fill="#150a36" fill-opacity="0.95" stroke="#38bdf8" stroke-width="3" />
    <text x="330" y="47" font-family="'Fredoka One', Nunito, sans-serif" font-size="32" font-weight="900" fill="#38bdf8" text-anchor="middle">
      📈 The Graph Tells the Story! 📈
    </text>
  </g>

  <!-- GIANT HOLOGRAPHIC COORDINATE PLANE GRID (Right Center) -->
  <g transform="translate(360, 160)">
    <!-- Holographic grid container card -->
    <rect width="610" height="680" rx="30" fill="#100624" fill-opacity="0.9" stroke="#818cf8" stroke-width="3" />

    <!-- Grid Lines -->
    <!-- Horizontal lines -->
    {[60, 50, 40, 30, 20, 10].map((val, i) => {
      const y = 80 + i * 85;
      return (
        <g key={val}>
          <line x1="80" y1={y} x2="570" y2={y} stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
          <text x="65" y={y + 5} fill="#94a3b8" font-family="Nunito, sans-serif" font-size="16" font-weight="bold" text-anchor="end">{val}</text>
        </g>
      );
    })}

    <!-- Vertical lines -->
    {[1, 2, 3, 4].map((val, i) => {
      const x = 80 + (i + 1) * 115;
      return (
        <g key={val}>
          <line x1={x} y1="40" x2={x} y2="595" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
          <text x={x} y="625" fill="#94a3b8" font-family="Nunito, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">{val}</text>
        </g>
      );
    })}

    <!-- Main X and Y Axes -->
    <!-- X Axis -->
    <line x1="80" y1="595" x2="580" y2="595" stroke="#38bdf8" stroke-width="4" />
    <polygon points="585,595 575,590 575,600" fill="#38bdf8" />
    <text x="560" y="580" font-family="'Fredoka One', Nunito, sans-serif" font-size="18" font-weight="900" fill="#38bdf8" text-anchor="end">
      Notebooks x ➔
    </text>

    <!-- Y Axis -->
    <line x1="80" y1="595" x2="80" y2="40" stroke="#facc15" stroke-width="4" />
    <polygon points="80,35 75,45 85,45" fill="#facc15" />
    <text x="95" y="45" font-family="'Fredoka One', Nunito, sans-serif" font-size="18" font-weight="900" fill="#facc15">
      Cost y (₹) ⬆️
    </text>

    <!-- GLOWING STRAIGHT PROPORTION LINE (Passes through origin) -->
    <line x1="80" y1="595" x2="540" y2="78" stroke="url(#rayGrad)" stroke-width="7" stroke-linecap="round" filter="url(#glow5)" />

    <!-- Plotted Coordinate Points (Constellation-like glowing spheres) -->
    <!-- Point 0: (0, 0) -->
    <g transform="translate(80, 595)">
      <circle cx="0" cy="0" r="14" fill="#facc15" filter="url(#glow5)" />
      <circle cx="0" cy="0" r="8" fill="#ffffff" />
      <rect x="-85" y="-35" width="80" height="28" rx="8" fill="#ca8a04" />
      <text x="-45" y="-16" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">(0, 0)</text>
    </g>

    <!-- Point 1: (1, 15) -->
    <g transform="translate(195, 465)">
      <circle cx="0" cy="0" r="10" fill="#4ade80" filter="url(#glow5)" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
      <text x="15" y="-10" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#4ade80">(1, 15)</text>
    </g>

    <!-- Point 2: (2, 30) -->
    <g transform="translate(310, 336)">
      <circle cx="0" cy="0" r="10" fill="#4ade80" filter="url(#glow5)" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
      <text x="15" y="-10" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#4ade80">(2, 30)</text>
    </g>

    <!-- Point 3: (3, 45) -->
    <g transform="translate(425, 206)">
      <circle cx="0" cy="0" r="10" fill="#4ade80" filter="url(#glow5)" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
      <text x="15" y="-10" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#4ade80">(3, 45)</text>
    </g>

    <!-- Point 4: (4, 60) -->
    <g transform="translate(540, 78)">
      <circle cx="0" cy="12" r="12" fill="#38bdf8" filter="url(#glow5)" />
      <circle cx="0" cy="12" r="6" fill="#ffffff" />
      <text x="-15" y="-8" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#38bdf8" text-anchor="end">(4, 60)</text>
    </g>
  </g>

  <!-- ANIME CHARACTER: ZARA (Standing on Left, pointing at the line & origin) -->
  <g transform="translate(60, 260)">
    <!-- Back Hair Flowing -->
    <path d="M 140 230 C 80 290 60 430 90 530 C 110 460 130 380 160 310 Z" fill="#451a03" />
    <path d="M 280 230 C 340 290 360 430 330 530 C 310 460 290 380 260 310 Z" fill="#451a03" />

    <!-- Torso: Sailor School Uniform -->
    <path d="M 140 330 L 280 330 L 305 560 L 115 560 Z" fill="#312e81" stroke="#1e1b4b" stroke-width="2" />
    <polygon points="180,330 240,330 210,410" fill="#ffffff" />
    <path d="M 155,325 L 210,395 L 265,325 L 275,340 L 210,420 L 145,340 Z" fill="#1e1b4b" stroke="#facc15" stroke-width="2" />
    <circle cx="210" cy="405" r="7" fill="#dc2626" />

    <!-- Neck & Face -->
    <rect x="195" y="280" width="30" height="55" fill="#fed7aa" rx="6" />
    <path d="M 140 220 Q 135 285 178 320 Q 210 340 242 320 Q 285 285 280 220 Z" fill="#ffedd5" />
    <ellipse cx="165" cy="290" rx="14" ry="7" fill="#f43f5e" opacity="0.45" />
    <ellipse cx="255" cy="290" rx="14" ry="7" fill="#f43f5e" opacity="0.45" />

    <!-- Nose & Smile -->
    <path d="M 209 280 L 211 286 L 207 287" fill="none" stroke="#d97706" stroke-width="1.5" />
    <path d="M 194 302 Q 210 320 226 302" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />

    <!-- Anime Eyes -->
    <g transform="translate(155, 250)">
      <path d="M 0 10 Q 14 -4 28 6" fill="none" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round" />
      <ellipse cx="15" cy="14" rx="10" ry="13" fill="url(#irisGrad5)" />
      <ellipse cx="15" cy="15" rx="5" ry="7" fill="#0f172a" />
      <circle cx="11" cy="9" r="4.5" fill="#ffffff" />
      <circle cx="19" cy="18" r="2.2" fill="#ffffff" />
    </g>
    <g transform="translate(225, 250)">
      <path d="M 0 6 Q 14 -4 28 10" fill="none" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round" />
      <ellipse cx="13" cy="14" rx="10" ry="13" fill="url(#irisGrad5)" />
      <ellipse cx="13" cy="15" rx="5" ry="7" fill="#0f172a" />
      <circle cx="9" cy="9" r="4.5" fill="#ffffff" />
      <circle cx="17" cy="18" r="2.2" fill="#ffffff" />
    </g>

    <!-- Hair Bangs -->
    <path d="M 130 220 Q 120 140 210 140 Q 300 140 290 220 Q 270 170 240 185 Q 210 170 180 190 Q 150 175 130 220 Z" fill="url(#hairGrad5)" />
    <path d="M 145 190 Q 155 255 165 260 Q 160 215 168 190 Z" fill="#713f12" />
    <path d="M 195 185 Q 208 250 215 255 Q 220 215 225 185 Z" fill="#854d0e" />
    <path d="M 245 190 Q 255 255 260 260 Q 256 215 260 190 Z" fill="#713f12" />
    <circle cx="258" cy="180" r="8" fill="#facc15" />

    <!-- Right Arm: Pointing with Glowing Stylus Wand toward the Origin (0,0) -->
    <path d="M 270 340 Q 340 380 370 470" fill="none" stroke="#312e81" stroke-width="24" stroke-linecap="round" />
    <circle cx="375" cy="475" r="14" fill="#fed7aa" />
    <!-- Glowing pointer wand -->
    <line x1="375" y1="475" x2="435" y2="495" stroke="#facc15" stroke-width="6" stroke-linecap="round" />
    <circle cx="438" cy="496" r="10" fill="#ffffff" filter="url(#glow5)" />

    <!-- Left Arm on Hip -->
    <path d="M 140 340 Q 80 390 110 460" fill="none" stroke="#312e81" stroke-width="24" stroke-linecap="round" />
    <circle cx="115" cy="465" r="14" fill="#fed7aa" />
  </g>

  <!-- 2 Crucial Rule Callout Badges (Bottom Left & Center) -->
  <g transform="translate(60, 890)" filter="url(#glow5)">
    <rect width="904" height="75" rx="37" fill="#150a36" fill-opacity="0.95" stroke="#4ade80" stroke-width="3" />
    <text x="452" y="47" font-family="'Fredoka One', Nunito, sans-serif" font-size="25" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✨ 1) Straight Line  +  2) Passes through (0, 0)  =  DIRECT PROPORTION! ✨
    </text>
  </g>
</svg>