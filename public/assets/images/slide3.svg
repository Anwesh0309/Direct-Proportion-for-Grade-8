<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Warm Japanese Shop Ambience -->
    <linearGradient id="shopBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e0f3d" />
      <stop offset="40%" stop-color="#2d1558" />
      <stop offset="80%" stop-color="#45183a" />
      <stop offset="100%" stop-color="#1a0826" />
    </linearGradient>

    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#d97706" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <!-- Wood Texture -->
    <linearGradient id="counterWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="25%" stop-color="#78350f" />
      <stop offset="60%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#290e02" />
    </linearGradient>

    <linearGradient id="hairGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="40%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="irisGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#4338ca" />
      <stop offset="80%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>

    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#shopBg)" />

  <!-- Warm Hanging Shop Lanterns (Left & Right) -->
  <g transform="translate(120, 60)">
    <line x1="0" y1="0" x2="0" y2="90" stroke="#f59e0b" stroke-width="3" />
    <circle cx="0" cy="130" r="100" fill="url(#lampGlow)" />
    <rect x="-30" y="90" width="60" height="75" rx="16" fill="#fef08a" stroke="#d97706" stroke-width="3" />
    <line x1="-30" y1="127" x2="30" y2="127" stroke="#d97706" stroke-width="2" />
  </g>
  <g transform="translate(904, 60)">
    <line x1="0" y1="0" x2="0" y2="90" stroke="#f59e0b" stroke-width="3" />
    <circle cx="0" cy="130" r="100" fill="url(#lampGlow)" />
    <rect x="-30" y="90" width="60" height="75" rx="16" fill="#fef08a" stroke="#d97706" stroke-width="3" />
    <line x1="-30" y1="127" x2="30" y2="127" stroke="#d97706" stroke-width="2" />
  </g>

  <!-- Title Plaque Banner -->
  <g transform="translate(232, 40)" filter="url(#glow3)">
    <rect width="560" height="65" rx="32" fill="#150a36" fill-opacity="0.95" stroke="#facc15" stroke-width="3" />
    <text x="280" y="44" font-family="'Fredoka One', Nunito, sans-serif" font-size="30" font-weight="900" fill="#facc15" text-anchor="middle">
      🔑 The Constant Ratio k = y ÷ x
    </text>
  </g>

  <!-- Stationery Shop Wooden Counter Table -->
  <path d="M 0 680 L 1024 680 L 1024 1024 L 0 1024 Z" fill="url(#counterWood)" />
  <line x1="0" y1="680" x2="1024" y2="680" stroke="#b45309" stroke-width="6" />
  <line x1="0" y1="710" x2="1024" y2="710" stroke="#78350f" stroke-width="3" />

  <!-- ANIME CHARACTER: ZARA (Center behind counter) -->
  <g transform="translate(362, 190)">
    <!-- Back Hair -->
    <path d="M 90 220 C 40 280 20 400 50 500 C 70 430 90 360 120 300 Z" fill="#451a03" />
    <path d="M 210 220 C 260 280 280 400 250 500 C 230 430 210 360 180 300 Z" fill="#451a03" />

    <!-- Torso / School Uniform -->
    <path d="M 100 320 L 200 320 L 220 500 L 80 500 Z" fill="#312e81" stroke="#1e1b4b" stroke-width="2" />
    <polygon points="130,320 170,320 150,380" fill="#ffffff" />
    <path d="M 115,315 L 150,375 L 185,315 L 195,330 L 150,400 L 105,330 Z" fill="#1e1b4b" stroke="#facc15" stroke-width="2" />
    <circle cx="150" cy="382" r="6" fill="#dc2626" />

    <!-- Neck & Face -->
    <rect x="138" y="275" width="24" height="48" fill="#fed7aa" rx="5" />
    <path d="M 100 220 Q 95 280 128 310 Q 150 328 172 310 Q 205 280 200 220 Z" fill="#ffedd5" />
    <!-- Blush -->
    <ellipse cx="118" cy="285" rx="12" ry="6" fill="#f43f5e" opacity="0.45" />
    <ellipse cx="182" cy="285" rx="12" ry="6" fill="#f43f5e" opacity="0.45" />

    <!-- Nose & Happy Smile -->
    <path d="M 149 275 L 151 280 L 147 281" fill="none" stroke="#d97706" stroke-width="1.5" />
    <path d="M 136 295 Q 150 310 164 295" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />

    <!-- Anime Left Eye -->
    <g transform="translate(112, 245)">
      <path d="M 0 8 Q 10 -4 22 5" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />
      <ellipse cx="11" cy="12" rx="8" ry="11" fill="url(#irisGrad3)" />
      <ellipse cx="11" cy="13" rx="4" ry="6" fill="#0f172a" />
      <circle cx="8" cy="8" r="3.5" fill="#ffffff" />
      <circle cx="14" cy="16" r="1.8" fill="#ffffff" />
    </g>
    <!-- Anime Right Eye -->
    <g transform="translate(162, 245)">
      <path d="M 0 5 Q 12 -4 22 8" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />
      <ellipse cx="11" cy="12" rx="8" ry="11" fill="url(#irisGrad3)" />
      <ellipse cx="11" cy="13" rx="4" ry="6" fill="#0f172a" />
      <circle cx="8" cy="8" r="3.5" fill="#ffffff" />
      <circle cx="14" cy="16" r="1.8" fill="#ffffff" />
    </g>

    <!-- Hair Bangs -->
    <path d="M 90 215 Q 85 145 150 145 Q 215 145 210 215 Q 195 180 170 190 Q 150 180 130 195 Q 110 185 90 215 Z" fill="url(#hairGrad3)" />
    <path d="M 100 190 Q 110 245 118 250 Q 115 210 120 190 Z" fill="#713f12" />
    <path d="M 135 185 Q 145 240 150 245 Q 155 210 160 185 Z" fill="#854d0e" />
    <path d="M 175 190 Q 185 245 190 250 Q 186 210 190 190 Z" fill="#713f12" />
    <circle cx="188" cy="180" r="7" fill="#facc15" />

    <!-- Raised Left Arm Holding the Glowing "k" Medallion Key -->
    <path d="M 100 330 Q 30 280 25 180" fill="none" stroke="#312e81" stroke-width="22" stroke-linecap="round" />
    <circle cx="25" cy="170" r="14" fill="#fed7aa" />

    <!-- Glowing Medallion: k = 15 -->
    <g transform="translate(25, 110)" filter="url(#glow3)">
      <circle cx="0" cy="0" r="48" fill="#facc15" stroke="#ffffff" stroke-width="4" />
      <circle cx="0" cy="0" r="40" fill="#ca8a04" stroke="#fde047" stroke-width="2" />
      <text x="0" y="14" font-family="'Fredoka One', Nunito, sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle">k</text>
    </g>

    <!-- Right Arm Resting on Counter -->
    <path d="M 200 330 Q 240 400 230 500" fill="none" stroke="#312e81" stroke-width="22" stroke-linecap="round" />
    <circle cx="230" cy="500" r="14" fill="#fed7aa" />
  </g>

  <!-- 4 NOTEBOOK STACKS ON COUNTER WITH PRICE TAGS -->
  <!-- Stack 1: 1 Notebook (₹15) -->
  <g transform="translate(70, 610)">
    <rect width="190" height="230" rx="20" fill="#150a36" fill-opacity="0.94" stroke="#38bdf8" stroke-width="3" />
    <rect x="0" y="0" width="190" height="40" rx="20" fill="#0284c7" />
    <text x="95" y="27" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">1 Notebook (x=1)</text>
    <text x="95" y="100" font-size="48" text-anchor="middle">📓</text>
    <text x="95" y="145" font-family="'Fredoka One', Nunito, sans-serif" font-size="28" font-weight="900" fill="#facc15" text-anchor="middle">₹15</text>
    <rect x="20" y="170" width="150" height="42" rx="12" fill="#15803d" />
    <text x="95" y="197" font-family="'Fredoka One', Nunito, sans-serif" font-size="15" font-weight="900" fill="#4ade80" text-anchor="middle">15 ÷ 1 = 15</text>
  </g>

  <!-- Stack 2: 2 Notebooks (₹30) -->
  <g transform="translate(295, 610)">
    <rect width="190" height="230" rx="20" fill="#150a36" fill-opacity="0.94" stroke="#38bdf8" stroke-width="3" />
    <rect x="0" y="0" width="190" height="40" rx="20" fill="#0284c7" />
    <text x="95" y="27" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">2 Notebooks (x=2)</text>
    <text x="75" y="100" font-size="42" text-anchor="middle">📓</text>
    <text x="115" y="100" font-size="42" text-anchor="middle">📓</text>
    <text x="95" y="145" font-family="'Fredoka One', Nunito, sans-serif" font-size="28" font-weight="900" fill="#facc15" text-anchor="middle">₹30</text>
    <rect x="20" y="170" width="150" height="42" rx="12" fill="#15803d" />
    <text x="95" y="197" font-family="'Fredoka One', Nunito, sans-serif" font-size="15" font-weight="900" fill="#4ade80" text-anchor="middle">30 ÷ 2 = 15</text>
  </g>

  <!-- Stack 3: 3 Notebooks (₹45) -->
  <g transform="translate(520, 610)">
    <rect width="190" height="230" rx="20" fill="#150a36" fill-opacity="0.94" stroke="#38bdf8" stroke-width="3" />
    <rect x="0" y="0" width="190" height="40" rx="20" fill="#0284c7" />
    <text x="95" y="27" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">3 Notebooks (x=3)</text>
    <text x="60" y="100" font-size="36" text-anchor="middle">📓</text>
    <text x="95" y="100" font-size="36" text-anchor="middle">📓</text>
    <text x="130" y="100" font-size="36" text-anchor="middle">📓</text>
    <text x="95" y="145" font-family="'Fredoka One', Nunito, sans-serif" font-size="28" font-weight="900" fill="#facc15" text-anchor="middle">₹45</text>
    <rect x="20" y="170" width="150" height="42" rx="12" fill="#15803d" />
    <text x="95" y="197" font-family="'Fredoka One', Nunito, sans-serif" font-size="15" font-weight="900" fill="#4ade80" text-anchor="middle">45 ÷ 3 = 15</text>
  </g>

  <!-- Stack 4: 4 Notebooks (₹60) -->
  <g transform="translate(745, 610)">
    <rect width="190" height="230" rx="20" fill="#150a36" fill-opacity="0.94" stroke="#38bdf8" stroke-width="3" />
    <rect x="0" y="0" width="190" height="40" rx="20" fill="#0284c7" />
    <text x="95" y="27" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">4 Notebooks (x=4)</text>
    <text x="60" y="95" font-size="32" text-anchor="middle">📓</text>
    <text x="95" y="95" font-size="32" text-anchor="middle">📓</text>
    <text x="130" y="95" font-size="32" text-anchor="middle">📓</text>
    <text x="95" y="118" font-size="32" text-anchor="middle">📓</text>
    <text x="95" y="145" font-family="'Fredoka One', Nunito, sans-serif" font-size="28" font-weight="900" fill="#facc15" text-anchor="middle">₹60</text>
    <rect x="20" y="170" width="150" height="42" rx="12" fill="#15803d" />
    <text x="95" y="197" font-family="'Fredoka One', Nunito, sans-serif" font-size="15" font-weight="900" fill="#4ade80" text-anchor="middle">60 ÷ 4 = 15</text>
  </g>

  <!-- Golden Universal Truth Bottom Ribbon -->
  <g transform="translate(182, 890)" filter="url(#glow3)">
    <rect width="660" height="60" rx="30" fill="#ca8a04" stroke="#fef08a" stroke-width="3" />
    <text x="330" y="40" font-family="'Fredoka One', Nunito, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">
      ✨ y ÷ x is ALWAYS 15! That fixed number is k = 15 ✨
    </text>
  </g>
</svg>