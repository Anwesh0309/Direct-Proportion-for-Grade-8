<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Cosmic Atelier Gradient -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14082c" />
      <stop offset="40%" stop-color="#241054" />
      <stop offset="75%" stop-color="#3b1578" />
      <stop offset="100%" stop-color="#0e0422" />
    </linearGradient>

    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#a855f7" stop-opacity="0.5" />
      <stop offset="75%" stop-color="#facc15" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Hair & Skin Gradients -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="40%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#4338ca" />
      <stop offset="80%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad2)" />

  <!-- Magic Golden Particle Geometry in Background -->
  <g opacity="0.35" stroke="#facc15" stroke-width="1.5" fill="none">
    <circle cx="512" cy="530" r="380" stroke-dasharray="10 8" />
    <circle cx="512" cy="530" r="330" />
    <polygon points="512,160 832,710 192,710" />
    <polygon points="512,900 832,350 192,350" />
  </g>

  <!-- Central Glowing Portal of Equal Multiplication -->
  <circle cx="512" cy="530" r="280" fill="url(#portalGlow)" opacity="0.4" />

  <!-- Top Title Plaque -->
  <g transform="translate(162, 50)" filter="url(#glow2)">
    <rect width="700" height="70" rx="35" fill="#150a36" fill-opacity="0.95" stroke="#4ade80" stroke-width="3" />
    <text x="350" y="47" font-family="'Fredoka One', Nunito, sans-serif" font-size="32" font-weight="900" fill="#4ade80" text-anchor="middle">
      ✨ Double One, Double the Other! ✨
    </text>
  </g>

  <!-- Left Column Panel: Notebooks (x) -->
  <g transform="translate(60, 160)">
    <rect width="360" height="760" rx="28" fill="#150a36" fill-opacity="0.92" stroke="#38bdf8" stroke-width="3" />
    <rect x="0" y="0" width="360" height="60" rx="28" fill="#0369a1" fill-opacity="0.8" />
    <text x="180" y="42" font-family="'Fredoka One', Nunito, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">
      📓 Notebooks (x)
    </text>

    <!-- Stage 1: 1 Notebook -->
    <g transform="translate(30, 80)">
      <rect width="300" height="140" rx="20" fill="#1e1045" stroke="#38bdf8" stroke-width="2" />
      <text x="75" y="85" font-size="60" text-anchor="middle">📓</text>
      <text x="195" y="65" font-family="'Fredoka One', Nunito, sans-serif" font-size="24" font-weight="900" fill="#bae6fd">1 Book</text>
      <text x="195" y="105" font-family="'Fredoka One', Nunito, sans-serif" font-size="30" font-weight="900" fill="#facc15">x = 1</text>
    </g>

    <!-- Arrow 1 to 2 with ×2 badge -->
    <g transform="translate(180, 245)">
      <line x1="0" y1="0" x2="0" y2="45" stroke="#4ade80" stroke-width="5" />
      <polygon points="0,52 -8,38 8,38" fill="#4ade80" />
      <rect x="-35" y="12" width="70" height="26" rx="13" fill="#15803d" stroke="#4ade80" stroke-width="2" />
      <text x="0" y="30" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">× 2</text>
    </g>

    <!-- Stage 2: 2 Notebooks -->
    <g transform="translate(30, 310)">
      <rect width="300" height="150" rx="20" fill="#1e1045" stroke="#38bdf8" stroke-width="2" />
      <text x="55" y="90" font-size="52" text-anchor="middle">📓</text>
      <text x="105" y="90" font-size="52" text-anchor="middle">📓</text>
      <text x="210" y="70" font-family="'Fredoka One', Nunito, sans-serif" font-size="24" font-weight="900" fill="#bae6fd">2 Books</text>
      <text x="210" y="110" font-family="'Fredoka One', Nunito, sans-serif" font-size="30" font-weight="900" fill="#facc15">x = 2</text>
    </g>

    <!-- Arrow 2 to 4 with ×2 badge -->
    <g transform="translate(180, 485)">
      <line x1="0" y1="0" x2="0" y2="45" stroke="#4ade80" stroke-width="5" />
      <polygon points="0,52 -8,38 8,38" fill="#4ade80" />
      <rect x="-35" y="12" width="70" height="26" rx="13" fill="#15803d" stroke="#4ade80" stroke-width="2" />
      <text x="0" y="30" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">× 2</text>
    </g>

    <!-- Stage 3: 4 Notebooks -->
    <g transform="translate(30, 550)">
      <rect width="300" height="170" rx="20" fill="#1e1045" stroke="#38bdf8" stroke-width="2" />
      <text x="50" y="70" font-size="44" text-anchor="middle">📓</text>
      <text x="95" y="70" font-size="44" text-anchor="middle">📓</text>
      <text x="50" y="125" font-size="44" text-anchor="middle">📓</text>
      <text x="95" y="125" font-size="44" text-anchor="middle">📓</text>
      <text x="210" y="80" font-family="'Fredoka One', Nunito, sans-serif" font-size="24" font-weight="900" fill="#bae6fd">4 Books</text>
      <text x="210" y="120" font-family="'Fredoka One', Nunito, sans-serif" font-size="30" font-weight="900" fill="#facc15">x = 4</text>
    </g>
  </g>

  <!-- Right Column Panel: Total Cost (y) -->
  <g transform="translate(604, 160)">
    <rect width="360" height="760" rx="28" fill="#150a36" fill-opacity="0.92" stroke="#facc15" stroke-width="3" />
    <rect x="0" y="0" width="360" height="60" rx="28" fill="#a16207" fill-opacity="0.8" />
    <text x="180" y="42" font-family="'Fredoka One', Nunito, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">
      💰 Total Cost in ₹ (y)
    </text>

    <!-- Stage 1: ₹15 -->
    <g transform="translate(30, 80)">
      <rect width="300" height="140" rx="20" fill="#1e1045" stroke="#facc15" stroke-width="2" />
      <text x="75" y="85" font-size="60" text-anchor="middle">🪙</text>
      <text x="195" y="65" font-family="'Fredoka One', Nunito, sans-serif" font-size="24" font-weight="900" fill="#fde047">Cost</text>
      <text x="195" y="110" font-family="'Fredoka One', Nunito, sans-serif" font-size="38" font-weight="900" fill="#facc15">₹15</text>
    </g>

    <!-- Arrow 1 to 2 with ×2 badge -->
    <g transform="translate(180, 245)">
      <line x1="0" y1="0" x2="0" y2="45" stroke="#4ade80" stroke-width="5" />
      <polygon points="0,52 -8,38 8,38" fill="#4ade80" />
      <rect x="-35" y="12" width="70" height="26" rx="13" fill="#15803d" stroke="#4ade80" stroke-width="2" />
      <text x="0" y="30" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">× 2</text>
    </g>

    <!-- Stage 2: ₹30 -->
    <g transform="translate(30, 310)">
      <rect width="300" height="150" rx="20" fill="#1e1045" stroke="#facc15" stroke-width="2" />
      <text x="55" y="90" font-size="52" text-anchor="middle">🪙</text>
      <text x="105" y="90" font-size="52" text-anchor="middle">🪙</text>
      <text x="210" y="70" font-family="'Fredoka One', Nunito, sans-serif" font-size="24" font-weight="900" fill="#fde047">Cost</text>
      <text x="210" y="115" font-family="'Fredoka One', Nunito, sans-serif" font-size="38" font-weight="900" fill="#facc15">₹30</text>
    </g>

    <!-- Arrow 2 to 4 with ×2 badge -->
    <g transform="translate(180, 485)">
      <line x1="0" y1="0" x2="0" y2="45" stroke="#4ade80" stroke-width="5" />
      <polygon points="0,52 -8,38 8,38" fill="#4ade80" />
      <rect x="-35" y="12" width="70" height="26" rx="13" fill="#15803d" stroke="#4ade80" stroke-width="2" />
      <text x="0" y="30" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#fff" text-anchor="middle">× 2</text>
    </g>

    <!-- Stage 3: ₹60 -->
    <g transform="translate(30, 550)">
      <rect width="300" height="170" rx="20" fill="#1e1045" stroke="#facc15" stroke-width="2" />
      <text x="50" y="70" font-size="44" text-anchor="middle">🪙</text>
      <text x="95" y="70" font-size="44" text-anchor="middle">🪙</text>
      <text x="50" y="125" font-size="44" text-anchor="middle">🪙</text>
      <text x="95" y="125" font-size="44" text-anchor="middle">🪙</text>
      <text x="210" y="80" font-family="'Fredoka One', Nunito, sans-serif" font-size="24" font-weight="900" fill="#fde047">Cost</text>
      <text x="210" y="125" font-family="'Fredoka One', Nunito, sans-serif" font-size="38" font-weight="900" fill="#facc15">₹60</text>
    </g>
  </g>

  <!-- CENTER ANIME CHARACTER: ZARA (Cheering in the middle between both columns) -->
  <g transform="translate(390, 480) scale(0.72)">
    <!-- Aura glow -->
    <circle cx="170" cy="180" r="140" fill="#4ade80" opacity="0.25" filter="url(#glow2)" />

    <!-- Head and Body -->
    <!-- Blazer & Shirt -->
    <path d="M 120 220 L 220 220 L 235 340 L 105 340 Z" fill="#312e81" stroke="#1e1b4b" stroke-width="2" />
    <polygon points="150,220 190,220 170,270" fill="#ffffff" />
    <path d="M 135,215 L 170,265 L 205,215 L 215,230 L 170,290 L 125,230 Z" fill="#1e1b4b" stroke="#facc15" stroke-width="2" />
    <circle cx="170" cy="272" r="6" fill="#dc2626" />

    <!-- Cheerful Raised Arms -->
    <!-- Left Hand pointing left to Books -->
    <path d="M 120 230 Q 60 210 20 180" fill="none" stroke="#312e81" stroke-width="20" stroke-linecap="round" />
    <circle cx="15" cy="175" r="12" fill="#fed7aa" />
    <!-- Right Hand pointing right to Cost -->
    <path d="M 220 230 Q 280 210 320 180" fill="none" stroke="#312e81" stroke-width="20" stroke-linecap="round" />
    <circle cx="325" cy="175" r="12" fill="#fed7aa" />

    <!-- Neck & Face -->
    <rect x="157" y="185" width="26" height="35" fill="#fed7aa" rx="5" />
    <path d="M 125 140 Q 120 190 148 215 Q 170 230 192 215 Q 220 190 215 140 Z" fill="#ffedd5" />
    <ellipse cx="140" cy="190" rx="10" ry="5" fill="#f43f5e" opacity="0.5" />
    <ellipse cx="200" cy="190" rx="10" ry="5" fill="#f43f5e" opacity="0.5" />

    <!-- Big Happy Anime Eyes (Closed Joyful Arc Expression ^^) -->
    <path d="M 132 165 Q 146 150 160 165" fill="none" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round" />
    <path d="M 180 165 Q 194 150 208 165" fill="none" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round" />
    <!-- Bright Open Smile -->
    <path d="M 154 195 Q 170 215 186 195 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />

    <!-- Hair Bangs -->
    <path d="M 115 140 Q 110 80 170 80 Q 230 80 225 140 Q 210 110 190 120 Q 170 110 150 125 Q 130 115 115 140 Z" fill="url(#hairGrad)" />
    <path d="M 125 120 Q 135 160 142 165 Q 140 130 148 120 Z" fill="#713f12" />
    <path d="M 160 115 Q 168 155 172 160 Q 175 130 180 115 Z" fill="#854d0e" />
    <path d="M 195 120 Q 205 160 210 165 Q 206 130 210 120 Z" fill="#713f12" />
    <circle cx="205" cy="115" r="7" fill="#facc15" />
  </g>

  <!-- Bottom Equal Factor Master Banner -->
  <g transform="translate(162, 930)" filter="url(#glow2)">
    <rect width="700" height="60" rx="30" fill="#15803d" stroke="#4ade80" stroke-width="2.5" />
    <text x="350" y="40" font-family="'Fredoka One', Nunito, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">
      ⭐ Both change by the EXACT SAME factor! ⭐
    </text>
  </g>
</svg>