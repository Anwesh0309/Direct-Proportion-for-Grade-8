<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Steampunk Anime Lab Background -->
    <linearGradient id="labBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#110729" />
      <stop offset="30%" stop-color="#1e0f45" />
      <stop offset="70%" stop-color="#2d1354" />
      <stop offset="100%" stop-color="#0a0319" />
    </linearGradient>

    <!-- Brass & Crystal Gradients -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <radialGradient id="crystalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="hairGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="40%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="irisGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#4338ca" />
      <stop offset="80%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>

    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#labBg)" />

  <!-- Laboratory Gearwheels in Background -->
  <g opacity="0.18" stroke="#ca8a04" stroke-width="4" fill="none">
    <circle cx="200" cy="240" r="140" stroke-dasharray="16 12" />
    <circle cx="200" cy="240" r="100" />
    <circle cx="850" cy="300" r="180" stroke-dasharray="20 14" />
    <circle cx="850" cy="300" r="130" />
    <circle cx="850" cy="300" r="60" />
  </g>

  <!-- Title Plaque Banner -->
  <g transform="translate(182, 45)" filter="url(#glow4)">
    <rect width="660" height="70" rx="35" fill="#150a36" fill-opacity="0.95" stroke="#facc15" stroke-width="3" />
    <text x="330" y="47" font-family="'Fredoka One', Nunito, sans-serif" font-size="32" font-weight="900" fill="#facc15" text-anchor="middle">
      ⚙️ The Master Formula: y = k × x ⚙️
    </text>
  </g>

  <!-- CENTRAL PROPORTION TRANSFORMER MACHINE -->
  <g transform="translate(430, 200)">
    <!-- Machine Frame / Tower -->
    <rect x="0" y="80" width="360" height="480" rx="32" fill="#1b0f3b" stroke="url(#brassGrad)" stroke-width="6" />
    
    <!-- Top Input Funnel (x enters here) -->
    <path d="M 60 0 L 300 0 L 240 90 L 120 90 Z" fill="#2d1760" stroke="#facc15" stroke-width="3" />
    <rect x="100" y="-30" width="160" height="38" rx="19" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <text x="180" y="-5" font-family="'Fredoka One', Nunito, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">
      INPUT (x = 3) ⬇️
    </text>

    <!-- Falling input tokens -->
    <circle cx="180" cy="45" r="22" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
    <text x="180" y="52" font-family="'Fredoka One', Nunito, sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle">x</text>

    <!-- Central Glowing Core Chamber: Multiplier × k -->
    <circle cx="180" cy="270" r="110" fill="url(#crystalGlow)" opacity="0.6" filter="url(#glow4)" />
    <circle cx="180" cy="270" r="85" fill="#150a36" stroke="#facc15" stroke-width="5" />
    <!-- Rotating magical runes around core -->
    <circle cx="180" cy="270" r="70" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" />
    <text x="180" y="260" font-family="'Fredoka One', Nunito, sans-serif" font-size="34" font-weight="900" fill="#fde047" text-anchor="middle">
      MULTIPLY
    </text>
    <text x="180" y="302" font-family="'Fredoka One', Nunito, sans-serif" font-size="44" font-weight="900" fill="#4ade80" text-anchor="middle">
      × 15
    </text>
    <text x="180" y="330" font-family="'Fredoka One', Nunito, sans-serif" font-size="16" font-weight="900" fill="#bae6fd" text-anchor="middle">
      (Core k = 15)
    </text>

    <!-- Machine Brass Pressure Dials & Piping -->
    <circle cx="50" cy="150" r="24" fill="#311a68" stroke="#f59e0b" stroke-width="3" />
    <line x1="50" y1="150" x2="62" y2="140" stroke="#f43f5e" stroke-width="2" />
    <circle cx="310" cy="150" r="24" fill="#311a68" stroke="#f59e0b" stroke-width="3" />
    <line x1="310" y1="150" x2="322" y2="140" stroke="#f43f5e" stroke-width="2" />

    <!-- Bottom Output Dispenser Tube (y exits here) -->
    <path d="M 110 540 L 250 540 L 280 620 L 80 620 Z" fill="#2d1760" stroke="#facc15" stroke-width="3" />
    <rect x="70" y="615" width="220" height="40" rx="20" fill="#15803d" stroke="#4ade80" stroke-width="2" />
    <text x="180" y="642" font-family="'Fredoka One', Nunito, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle">
      OUTPUT (y = 45) ⬇️
    </text>

    <!-- Falling sparkling output coins & answers -->
    <g transform="translate(180, 690)">
      <circle cx="-35" cy="20" r="22" fill="#facc15" stroke="#ffffff" stroke-width="2" />
      <text x="-35" y="27" font-size="16" font-weight="bold" text-anchor="middle">₹15</text>
      <circle cx="0" cy="45" r="24" fill="#facc15" stroke="#ffffff" stroke-width="2" />
      <text x="0" y="53" font-size="16" font-weight="bold" text-anchor="middle">₹15</text>
      <circle cx="35" cy="20" r="22" fill="#facc15" stroke="#ffffff" stroke-width="2" />
      <text x="35" y="27" font-size="16" font-weight="bold" text-anchor="middle">₹15</text>
    </g>
  </g>

  <!-- ANIME INVENTOR ZARA (Left Side with Cute Goggles) -->
  <g transform="translate(60, 290)">
    <!-- Aura glow -->
    <circle cx="210" cy="300" r="180" fill="#a855f7" opacity="0.15" filter="url(#glow4)" />

    <!-- Back hair flowing -->
    <path d="M 140 230 C 80 290 60 430 90 530 C 110 460 130 380 160 310 Z" fill="#451a03" />
    <path d="M 280 230 C 340 290 360 430 330 530 C 310 460 290 380 260 310 Z" fill="#451a03" />

    <!-- Outfit: Steampunk-anime vest with brass buttons & cravat -->
    <path d="M 140 330 L 280 330 L 305 560 L 115 560 Z" fill="#1e1045" stroke="#ca8a04" stroke-width="3" />
    <polygon points="180,330 240,330 210,410" fill="#ffffff" />
    <circle cx="210" cy="415" r="8" fill="#f59e0b" />
    <circle cx="210" cy="455" r="8" fill="#f59e0b" />
    <circle cx="210" cy="495" r="8" fill="#f59e0b" />

    <!-- Neck & Face -->
    <rect x="195" y="280" width="30" height="55" fill="#fed7aa" rx="6" />
    <path d="M 140 220 Q 135 285 178 320 Q 210 340 242 320 Q 285 285 280 220 Z" fill="#ffedd5" />
    <ellipse cx="165" cy="290" rx="14" ry="7" fill="#f43f5e" opacity="0.45" />
    <ellipse cx="255" cy="290" rx="14" ry="7" fill="#f43f5e" opacity="0.45" />

    <!-- Smile & Nose -->
    <path d="M 209 280 L 211 286 L 207 287" fill="none" stroke="#d97706" stroke-width="1.5" />
    <path d="M 194 302 Q 210 320 226 302" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />

    <!-- Big Anime Eyes with Confident Sparkling Look -->
    <g transform="translate(155, 250)">
      <path d="M 0 10 Q 14 -4 28 6" fill="none" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round" />
      <ellipse cx="15" cy="14" rx="10" ry="13" fill="url(#irisGrad4)" />
      <ellipse cx="15" cy="15" rx="5" ry="7" fill="#0f172a" />
      <circle cx="11" cy="9" r="4.5" fill="#ffffff" />
      <circle cx="19" cy="18" r="2.2" fill="#ffffff" />
    </g>
    <g transform="translate(225, 250)">
      <path d="M 0 6 Q 14 -4 28 10" fill="none" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round" />
      <ellipse cx="13" cy="14" rx="10" ry="13" fill="url(#irisGrad4)" />
      <ellipse cx="13" cy="15" rx="5" ry="7" fill="#0f172a" />
      <circle cx="9" cy="9" r="4.5" fill="#ffffff" />
      <circle cx="17" cy="18" r="2.2" fill="#ffffff" />
    </g>

    <!-- Hair Bangs -->
    <path d="M 130 220 Q 120 140 210 140 Q 300 140 290 220 Q 270 170 240 185 Q 210 170 180 190 Q 150 175 130 220 Z" fill="url(#hairGrad4)" />
    <path d="M 145 190 Q 155 255 165 260 Q 160 215 168 190 Z" fill="#713f12" />
    <path d="M 195 185 Q 208 250 215 255 Q 220 215 225 185 Z" fill="#854d0e" />
    <path d="M 245 190 Q 255 255 260 260 Q 256 215 260 190 Z" fill="#713f12" />

    <!-- Cute Steampunk Aviator Goggles Pushed Up on Hair -->
    <g transform="translate(155, 125)">
      <!-- Goggle Strap -->
      <path d="M -35 25 Q 55 5 145 25" fill="none" stroke="#78350f" stroke-width="10" />
      <!-- Left Lens Frame -->
      <circle cx="20" cy="20" r="28" fill="#ca8a04" stroke="#facc15" stroke-width="4" />
      <circle cx="20" cy="20" r="20" fill="#38bdf8" opacity="0.8" />
      <line x1="8" y1="12" x2="32" y2="28" stroke="#ffffff" stroke-width="3" opacity="0.7" />
      <!-- Bridge -->
      <rect x="44" y="16" width="22" height="8" rx="4" fill="#ca8a04" />
      <!-- Right Lens Frame -->
      <circle cx="90" cy="20" r="28" fill="#ca8a04" stroke="#facc15" stroke-width="4" />
      <circle cx="90" cy="20" r="20" fill="#38bdf8" opacity="0.8" />
      <line x1="78" y1="12" x2="102" y2="28" stroke="#ffffff" stroke-width="3" opacity="0.7" />
    </g>

    <!-- Right Arm Pulling the Machine Activator Lever -->
    <path d="M 270 340 Q 350 330 380 280" fill="none" stroke="#1e1045" stroke-width="24" stroke-linecap="round" />
    <circle cx="385" cy="275" r="15" fill="#fed7aa" />
    <!-- Golden Lever -->
    <line x1="385" y1="275" x2="420" y2="230" stroke="#facc15" stroke-width="7" stroke-linecap="round" />
    <circle cx="423" cy="226" r="14" fill="#ef4444" stroke="#fff" stroke-width="2" />

    <!-- Left Arm Gesturing at Formula -->
    <path d="M 140 340 Q 70 370 40 430" fill="none" stroke="#1e1045" stroke-width="24" stroke-linecap="round" />
    <circle cx="35" cy="435" r="15" fill="#fed7aa" />
  </g>

  <!-- Large Bottom Holographic Equation Banner -->
  <g transform="translate(100, 890)" filter="url(#glow4)">
    <rect width="824" height="80" rx="40" fill="#150a36" fill-opacity="0.95" stroke="#38bdf8" stroke-width="3.5" />
    <text x="412" y="52" font-family="'Fredoka One', Nunito, sans-serif" font-size="32" font-weight="900" fill="#38bdf8" text-anchor="middle">
      💡 Example: For 3 notebooks ➔ y = 15 × 3 = ₹45!
    </text>
  </g>
</svg>