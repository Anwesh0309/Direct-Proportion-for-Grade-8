<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Vibrant Cosmic Lab Portal Background -->
    <linearGradient id="portalBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140628" />
      <stop offset="30%" stop-color="#2a0d52" />
      <stop offset="70%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#090214" />
    </linearGradient>

    <!-- Glowing Lab Archway Portal -->
    <radialGradient id="labPortal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="65%" stop-color="#c084fc" stop-opacity="0.45" />
      <stop offset="90%" stop-color="#facc15" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="hairGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#854d0e" />
      <stop offset="40%" stop-color="#713f12" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="irisGrad8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#4338ca" />
      <stop offset="80%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>

    <filter id="glow8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#portalBg)" />

  <!-- Giant Glowing Laboratory Portal Arch in Background -->
  <circle cx="512" cy="460" r="380" fill="url(#labPortal)" />
  <circle cx="512" cy="460" r="350" fill="none" stroke="#facc15" stroke-width="3" stroke-dasharray="14 10" opacity="0.6" />
  <circle cx="512" cy="460" r="300" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" />

  <!-- Confetti Celebration Particles -->
  <g opacity="0.85">
    <polygon points="120,180 135,170 145,185 130,195" fill="#f43f5e" />
    <polygon points="860,190 875,180 885,195 870,205" fill="#facc15" />
    <polygon points="190,280 205,270 215,285 200,295" fill="#4ade80" />
    <polygon points="820,290 835,280 845,295 830,305" fill="#38bdf8" />
    <circle cx="150" cy="380" r="8" fill="#facc15" />
    <circle cx="890" cy="400" r="9" fill="#ec4899" />
    <polygon points="240,140 250,155 235,165 225,150" fill="#a855f7" />
    <polygon points="780,140 790,155 775,165 765,150" fill="#38bdf8" />
  </g>

  <!-- Top Title Plaque Banner -->
  <g transform="translate(182, 45)" filter="url(#glow8)">
    <rect width="660" height="70" rx="35" fill="#150a36" fill-opacity="0.95" stroke="#facc15" stroke-width="3.5" />
    <text x="330" y="47" font-family="'Fredoka One', Nunito, sans-serif" font-size="32" font-weight="900" fill="#facc15" text-anchor="middle">
      🧪 Step Into the Simulation Lab! 🧪
    </text>
  </g>

  <!-- 4 FLOATING MINIATURE HOLOGRAPHIC STATIONS AROUND ZARA -->
  <!-- Top Left: 1. Smoothie Blender -->
  <g transform="translate(80, 160)" filter="url(#glow8)">
    <rect width="210" height="150" rx="20" fill="#150a36" fill-opacity="0.92" stroke="#38bdf8" stroke-width="2.5" />
    <text x="105" y="75" font-size="52" text-anchor="middle">🥤</text>
    <text x="105" y="115" font-family="'Fredoka One', Nunito, sans-serif" font-size="18" font-weight="900" fill="#38bdf8" text-anchor="middle">
      Smoothie Mixer
    </text>
    <text x="105" y="135" font-family="Nunito, sans-serif" font-size="12" font-weight="bold" fill="#bae6fd" text-anchor="middle">
      k = ₹15 per cup
    </text>
  </g>

  <!-- Top Right: 2. Plotting Graph -->
  <g transform="translate(734, 160)" filter="url(#glow8)">
    <rect width="210" height="150" rx="20" fill="#150a36" fill-opacity="0.92" stroke="#4ade80" stroke-width="2.5" />
    <text x="105" y="75" font-size="52" text-anchor="middle">📈</text>
    <text x="105" y="115" font-family="'Fredoka One', Nunito, sans-serif" font-size="18" font-weight="900" fill="#4ade80" text-anchor="middle">
      Plot the Line
    </text>
    <text x="105" y="135" font-family="Nunito, sans-serif" font-size="12" font-weight="bold" fill="#86efac" text-anchor="middle">
      Straight line at (0, 0)
    </text>
  </g>

  <!-- Bottom Left: 3. Scale Balance -->
  <g transform="translate(80, 680)" filter="url(#glow8)">
    <rect width="210" height="150" rx="20" fill="#150a36" fill-opacity="0.92" stroke="#facc15" stroke-width="2.5" />
    <text x="105" y="75" font-size="52" text-anchor="middle">⚖️</text>
    <text x="105" y="115" font-family="'Fredoka One', Nunito, sans-serif" font-size="18" font-weight="900" fill="#facc15" text-anchor="middle">
      Balance the Scale
    </text>
    <text x="105" y="135" font-family="Nunito, sans-serif" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle">
      Equal proportional ratios
    </text>
  </g>

  <!-- Bottom Right: 4. Map Navigator -->
  <g transform="translate(734, 680)" filter="url(#glow8)">
    <rect width="210" height="150" rx="20" fill="#150a36" fill-opacity="0.92" stroke="#ec4899" stroke-width="2.5" />
    <text x="105" y="75" font-size="52" text-anchor="middle">🗺️</text>
    <text x="105" y="115" font-family="'Fredoka One', Nunito, sans-serif" font-size="18" font-weight="900" fill="#ec4899" text-anchor="middle">
      Map Navigator
    </text>
    <text x="105" y="135" font-family="Nunito, sans-serif" font-size="12" font-weight="bold" fill="#fbcfe8" text-anchor="middle">
      1 cm : 20 km scale
    </text>
  </g>

  <!-- CENTER ANIME CHARACTER: ZARA (Waving enthusiastic invitation) -->
  <g transform="translate(362, 230)">
    <!-- Back Hair Flowing -->
    <path d="M 90 220 C 40 280 20 400 50 500 C 70 430 90 360 120 300 Z" fill="#451a03" />
    <path d="M 210 220 C 260 280 280 400 250 500 C 230 430 210 360 180 300 Z" fill="#451a03" />

    <!-- Torso: Sailor School Uniform -->
    <path d="M 100 320 L 200 320 L 220 540 L 80 540 Z" fill="#312e81" stroke="#1e1b4b" stroke-width="2" />
    <polygon points="130,320 170,320 150,380" fill="#ffffff" />
    <path d="M 115,315 L 150,375 L 185,315 L 195,330 L 150,400 L 105,330 Z" fill="#1e1b4b" stroke="#facc15" stroke-width="2" />
    <circle cx="150" cy="382" r="6" fill="#dc2626" />

    <!-- Neck & Face -->
    <rect x="138" y="275" width="24" height="48" fill="#fed7aa" rx="5" />
    <path d="M 100 220 Q 95 280 128 310 Q 150 328 172 310 Q 205 280 200 220 Z" fill="#ffedd5" />
    <ellipse cx="118" cy="285" rx="12" ry="6" fill="#f43f5e" opacity="0.45" />
    <ellipse cx="182" cy="285" rx="12" ry="6" fill="#f43f5e" opacity="0.45" />

    <!-- Cheerful Big Smile -->
    <path d="M 149 275 L 151 280 L 147 281" fill="none" stroke="#d97706" stroke-width="1.5" />
    <path d="M 134 295 Q 150 318 166 295" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />

    <!-- Sparkling Anime Eyes -->
    <g transform="translate(112, 245)">
      <path d="M 0 8 Q 10 -4 22 5" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />
      <ellipse cx="11" cy="12" rx="8" ry="11" fill="url(#irisGrad8)" />
      <ellipse cx="11" cy="13" rx="4" ry="6" fill="#0f172a" />
      <circle cx="8" cy="8" r="3.5" fill="#ffffff" />
      <circle cx="14" cy="16" r="1.8" fill="#ffffff" />
    </g>
    <g transform="translate(162, 245)">
      <path d="M 0 5 Q 12 -4 22 8" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" />
      <ellipse cx="11" cy="12" rx="8" ry="11" fill="url(#irisGrad8)" />
      <ellipse cx="11" cy="13" rx="4" ry="6" fill="#0f172a" />
      <circle cx="8" cy="8" r="3.5" fill="#ffffff" />
      <circle cx="14" cy="16" r="1.8" fill="#ffffff" />
    </g>

    <!-- Hair Bangs -->
    <path d="M 90 215 Q 85 145 150 145 Q 215 145 210 215 Q 195 180 170 190 Q 150 180 130 195 Q 110 185 90 215 Z" fill="url(#hairGrad8)" />
    <path d="M 100 190 Q 110 245 118 250 Q 115 210 120 190 Z" fill="#713f12" />
    <path d="M 135 185 Q 145 240 150 245 Q 155 210 160 185 Z" fill="#854d0e" />
    <path d="M 175 190 Q 185 245 190 250 Q 186 210 190 190 Z" fill="#713f12" />
    <circle cx="188" cy="180" r="7" fill="#facc15" />

    <!-- Both Arms Welcoming with Open Arms / Waving -->
    <!-- Left Hand Waving -->
    <path d="M 100 330 Q 30 260 10 180" fill="none" stroke="#312e81" stroke-width="22" stroke-linecap="round" />
    <circle cx="8" cy="170" r="14" fill="#fed7aa" />
    <g transform="translate(0, 140)">
      <circle cx="8" cy="10" r="5" fill="#facc15" />
      <line x1="-5" y1="5" x2="20" y2="15" stroke="#facc15" stroke-width="2" />
    </g>

    <!-- Right Hand Waving -->
    <path d="M 200 330 Q 270 260 290 180" fill="none" stroke="#312e81" stroke-width="22" stroke-linecap="round" />
    <circle cx="292" cy="170" r="14" fill="#fed7aa" />
    <g transform="translate(285, 140)">
      <circle cx="8" cy="10" r="5" fill="#facc15" />
      <line x1="-5" y1="5" x2="20" y2="15" stroke="#facc15" stroke-width="2" />
    </g>
  </g>

  <!-- Large Welcome Callout Banner (Bottom Center) -->
  <g transform="translate(100, 890)" filter="url(#glow8)">
    <rect width="824" height="75" rx="37" fill="#150a36" fill-opacity="0.95" stroke="#facc15" stroke-width="3" />
    <text x="412" y="47" font-family="'Fredoka One', Nunito, sans-serif" font-size="26" font-weight="900" fill="#facc15" text-anchor="middle">
      🎉 You mastered the theory! Tap below to enter the Lab! 🧪
    </text>
  </g>
</svg>